name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow only checks code, it never writes to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    name: check (Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (exactly the locked versions)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov
      - name: Policies pass warden check
        run: |
          uv run warden check policies/default.json --strict
          uv run warden check examples/demo-policy.json --strict
      - name: Demo
        run: uv run python examples/demo.py
