name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow only checks code, it never writes to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    name: check (Python ${{ matrix.python }})
    steps:
      # Actions are pinned to exact commits (a tag can be moved); Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (exactly the locked versions)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov
      - name: Policies pass warden check
        run: |
          uv run warden check policies/default.json --strict
          uv run warden check examples/demo-policy.json --strict
      - name: Policy tests
        run: uv run warden test examples/policy-tests.json
      - name: Demo
        run: uv run python examples/demo.py
