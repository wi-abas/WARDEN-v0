name: Mutation tests

# Plants one bug at a time in the security-critical modules and checks that a test
# catches it (scripts/mutation.py). Slow, so weekly and on demand, not on every push.
on:
  schedule:
    - cron: "41 3 * * 0" # Sundays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install (exactly the locked versions)
        run: uv sync --locked
      # 2026-11-23: every module 97-100% (reviewed equivalent spots are marked
      # "# mutation-ok: <why>" in the source and not planted). Takes about an hour.
      - name: Mutation tests
        run: uv run python scripts/mutation.py --min-score 90
