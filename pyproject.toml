[project]
name = "agent-warden"
version = "0.4.1"
description = "Deterministic, local-first policy layer for AI agent tool calls"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Wissam Abas" }
]
requires-python = ">=3.12"
keywords = ["ai-agents", "llm", "security", "policy", "guardrails", "tool-calling", "approval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "uvicorn>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/wi-abas/agent-warden"
Documentation = "https://github.com/wi-abas/agent-warden/tree/main/docs"
Issues = "https://github.com/wi-abas/agent-warden/issues"
Changelog = "https://github.com/wi-abas/agent-warden/blob/main/CHANGELOG.md"
Security = "https://github.com/wi-abas/agent-warden/blob/main/SECURITY.md"

[project.scripts]
warden = "warden.cli:run"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
fuzz = [
    "atheris==3.1.0 ; sys_platform == 'linux'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: import order, B: common bugs, UP: modern syntax, S: security checks
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
files = ["src", "examples", "scripts", "tests"]
mypy_path = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[tool.uv.build-backend]
# Installed as "agent-warden" (the name "warden" is taken on PyPI), imported as "warden".
module-name = "warden"
source-exclude = ["**/.DS_Store", "**/__pycache__"]
wheel-exclude = ["**/.DS_Store", "**/__pycache__"]

[tool.coverage.run]
source = ["warden"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# CI fails if coverage drops below this.
fail_under = 98
